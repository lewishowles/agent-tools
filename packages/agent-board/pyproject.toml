[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-board"
version = "0.1.0"
description = "Show HCOM teams that need the human in one terminal board"
requires-python = ">=3.11"

[project.scripts]
agent-board = "agent_board.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
