[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-paths"
version = "0.1.0"
description = "Check local path claims in Markdown files"
requires-python = ">=3.11"

[project.scripts]
doc-paths = "doc_paths.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
