[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-send"
version = "0.1.0"
description = "Send an HCOM message to one live teammate by role"
requires-python = ">=3.11"

[project.scripts]
team-send = "team_send.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
