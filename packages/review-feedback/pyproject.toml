[project]
name = "review-feedback"
version = "0.1.0"
description = "Turn worktree selections into review comments and split changes into reviewable patches."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/lewishowles/dev-tools/tree/main/packages/review-feedback"
Repository = "https://github.com/lewishowles/dev-tools"

[project.scripts]
review-feedback = "review_feedback.cli:main"
review-patches = "review_feedback.patches:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_feedback"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "tab"
