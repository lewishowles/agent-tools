[project]
name = "agents-progress"
dynamic = ["version"]
description = "Command-line tool for tracking project progress, stored locally."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
	"lewishowles-cli-style>=0.17.1",
	"prompt-toolkit>=3.0",
	"questionary>=2.1.1",
]

[project.scripts]
progress = "agents_progress.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agents_progress/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_progress"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["agents_progress"]

[tool.ruff.format]
indent-style = "tab"
