[project]
name = "review-packet"
version = "0.1.0"
description = "Draft focused outside review packets."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
review-packet = "review_packet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_packet"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "tab"
